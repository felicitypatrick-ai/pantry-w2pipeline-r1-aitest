# .github/workflows/pipeline.yml
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Write test results to run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Test results"
            echo ""
            echo "Outcome: **${{ steps.tests.outcome }}**"
            echo ""
            echo '```'
            if [ -f test-results.txt ]; then
              cat test-results.txt
            else
              echo "No test output was produced."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build dist folder
        shell: bash
        run: |
          mkdir -p dist
          cp app/*.py dist/
          echo "Commit: ${{ github.sha }}" > dist/BUILD_INFO.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pantry-app
          path: dist/
